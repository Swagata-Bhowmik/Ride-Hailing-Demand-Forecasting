# Scheduled auto-refresh (free-tier GitHub Actions) - Requirement 10
#
# Re-runs the prepare -> forecast pipeline on a cron schedule and records both
# success and failure in the run logs.
#
#   R10.1  Provides a scheduled auto-refresh capability.
#   R10.2  Uses free-tier services only (GitHub-hosted ubuntu runner, no paid add-ons).
#   R10.3  Runs on a defined schedule using GitHub Actions (cron below).
#   R10.4  If an automated run fails, the failure is recorded in the run logs
#          (the pipeline logs STATUS=FAILURE and exits non-zero, so the job is
#          marked failed and a failure summary is written to the run log).
#
# The ~1 GB real NYC TLC data is git-ignored and absent in CI, so the pipeline
# entry point (scripts/refresh_pipeline.py) degrades gracefully to a synthetic
# fixture that exercises the real pipeline code paths without fabricating results.

name: Scheduled Auto-Refresh

# R10.3: defined schedule + manual trigger for on-demand runs.
on:
  schedule:
    # Every day at 06:00 UTC. Cron is free on GitHub-hosted runners (R10.2).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Keep only the latest scheduled run if several queue up.
concurrency:
  group: auto-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Re-run prepare -> forecast pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # R10.1 + R10.4: run the pipeline; capture success/failure explicitly.
      # `set -o pipefail` ensures the python exit code survives the tee pipe, so a
      # failed refresh (non-zero exit) fails this step and is recorded in the log.
      - name: Run auto-refresh pipeline
        id: refresh
        run: |
          set -o pipefail
          python scripts/refresh_pipeline.py 2>&1 | tee refresh.log

      # R10.4: record the outcome in the run log AND the job summary, for both
      # success and failure. `if: always()` guarantees this runs even when the
      # pipeline step above failed.
      - name: Record run outcome
        if: always()
        run: |
          if [ "${{ steps.refresh.outcome }}" = "success" ]; then
            echo "Auto-refresh SUCCESS at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "### Auto-refresh SUCCESS :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Auto-refresh FAILURE at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "### Auto-refresh FAILURE :x:" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f refresh.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 25 refresh.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Preserve the full pipeline log as an artifact for post-run inspection (R10.4).
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: refresh.log
          if-no-files-found: warn
